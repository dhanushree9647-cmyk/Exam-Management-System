```html
<!DOCTYPE html>
<html>
<head>
    <title>Staff Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .staff-container {
            padding: 25px;
        }

        .staff-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .staff-form input {
            margin: 8px;
            padding: 12px;
        }

        .staff-table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        .staff-table th,
        .staff-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .action-menu {
            position: relative;
            display: inline-block;
        }

        .action-menu summary {
            display: block;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            text-align: center;
            padding: 5px;
            list-style: none;
        }

        .action-menu summary::-webkit-details-marker {
            display: none;
        }

        .action-options {
            position: absolute;
            right: 0;
            top: 35px;
            background: white;
            min-width: 130px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            border-radius: 8px;
            z-index: 100;
            padding: 8px;
        }

        .action-options a,
        .action-options button {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: left;
            text-decoration: none;
            color: #333;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .action-options a:hover,
        .action-options button:hover {
            background: #f1f5f9;
        }

        .delete-option {
            color: #dc2626 !important;
        }
    </style>
</head>

<body>

<div class="staff-container">

    <h1>Staff Management</h1>

    <form class="staff-form" method="POST"
          action="{{ url_for('staff') }}">

        <input type="text" name="name"
               placeholder="Staff Name" required>

        <input type="text" name="department"
               placeholder="Department" required>

        <button type="submit">Add Staff</button>

    </form>

    <h2>Staff List</h2>

    <table class="staff-table">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>

        {% for member in staff %}
        <tr>
            <td>{{ member.id }}</td>
            <td>{{ member.name }}</td>
            <td>{{ member.department }}</td>

            <td>
                <details class="action-menu">
                    <summary title="More options">&#8942;</summary>

                    <div class="action-options">

                        <a href="{{ url_for('view_staff', staff_id=member.id) }}">
                            View
                        </a>

                        <a href="{{ url_for('edit_staff', staff_id=member.id) }}">
                            Edit
                        </a>

                        <form method="POST"
                              action="{{ url_for('delete_staff', staff_id=member.id) }}"
                              onsubmit="return confirm('Are you sure you want to delete this staff member?');">

                            <button type="submit" class="delete-option">
                                Delete
                            </button>

                        </form>

                    </div>
                </details>
            </td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</div>

</body>
</html>
```
