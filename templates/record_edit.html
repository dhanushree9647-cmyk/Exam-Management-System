
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="student-container">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% if kind == "exam" %}

            <label>Subject</label><br>
            <select name="subject_id" required>
                {% for subject in subjects %}
                <option value="{{ subject.id }}"
                    {% if subject.id == record.subject_id %}selected{% endif %}>
                    {{ subject.subject_name }}
                </option>
                {% endfor %}
            </select><br><br>

            <label>Exam Date</label><br>
            <input type="date" name="exam_date"
                   value="{{ record.exam_date }}" required><br><br>

            <label>Start Time</label><br>
            <input type="time" name="start_time"
                   value="{{ record.start_time }}" required><br><br>

            <label>End Time</label><br>
            <input type="time" name="end_time"
                   value="{{ record.end_time }}" required><br><br>

            <label>Course</label><br>
            <input type="text" name="course"
                   value="{{ record.course }}" required><br><br>

            <label>Semester</label><br>
            <input type="text" name="semester"
                   value="{{ record.semester }}" required><br><br>

        {% elif kind == "allocation" %}

            <label>Select Room</label><br>
            <select name="room_id" required>
                {% for room in rooms %}
                <option value="{{ room.id }}"
                    {% if room.id == record.room_id %}selected{% endif %}>
                    {{ room.room_name }} (Capacity: {{ room.capacity }})
                </option>
                {% endfor %}
            </select><br><br>

        {% elif kind == "staff_allocation" %}

            <label>Select Staff</label><br>
            <select name="staff_id">
                <option value="">Unassigned</option>
                {% for member in staff %}
                <option value="{{ member.id }}"
                    {% if member.id == record.staff_id %}selected{% endif %}>
                    {{ member.name }} - {{ member.department }}
                </option>
                {% endfor %}
            </select><br><br>

        {% elif kind == "seat" %}

            <p><strong>Student:</strong> {{ record.name }}</p>
            <p><strong>Roll Number:</strong> {{ record.roll_no }}</p>
            <p><strong>Subject:</strong> {{ record.subject_name }}</p>

            <label>Seat Number</label><br>
            <input type="number" name="seat_number"
                   value="{{ record.seat_number }}"
                   min="1" required><br><br>

        {% endif %}

        <button type="submit">Save Changes</button>

    </form>

    <br>
    <a href="{{ url_for('exam_dashboard') }}">Back to Examination Dashboard</a>

</div>
</body>
</html>
