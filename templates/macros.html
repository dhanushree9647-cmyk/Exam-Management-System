{% macro action_menu(view_url, edit_url, delete_url, label='record') %}
<div class="action-menu">
  <button type="button" class="dots" aria-label="Actions" aria-expanded="false" onclick="toggleMenu(this)">⋮</button>
  <div class="menu-pop">
    <a href="{{ view_url }}">◉ &nbsp;View</a>
    <a href="{{ edit_url }}">✎ &nbsp;Edit</a>
    <form method="post" action="{{ delete_url }}" onsubmit="return confirm('Delete this {{ label }}? This action cannot be undone.')"><button class="delete-link">▣ &nbsp;Delete</button></form>
  </div>
</div>
{% endmacro %}
