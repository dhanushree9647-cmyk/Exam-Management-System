{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{ 'Edit' if item else 'Add' }} Room</h1><p>Enter the room details and actual seating capacity.</p></div><a class="btn light" href="{{ url_for('rooms') }}">← Back</a></div>
<form class="panel form-grid" method="post"><label>Room Number<input name="room_no" required value="{{ item.room_no if item else '' }}" placeholder="A-001"></label><label>Block<input name="block" required value="{{ item.block if item else '' }}" placeholder="A Block"></label><label>Seating Capacity<input type="number" min="1" name="capacity" required value="{{ item.capacity if item else '' }}"></label><label class="span-2">Notes<textarea name="notes" rows="3">{{ item.notes if item else '' }}</textarea></label><div class="form-actions"><button class="btn primary">Save Room</button><a class="btn light" href="{{ url_for('rooms') }}">Cancel</a></div></form>{% endblock %}
